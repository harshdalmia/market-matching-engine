# Fly.io deployment for the matching engine.
#
# Rename `app` to something unique, then:
#   fly launch --no-deploy --copy-config
#   fly secrets set ALLOWED_ORIGINS="https://your-frontend.vercel.app"
#   fly deploy

app = "matching-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Set ALLOWED_ORIGINS via `fly secrets set` (or here, it is not sensitive)
  # to lock CORS down to the deployed frontend origin. Unset means any origin.

[http_service]
  internal_port = 8080
  force_https = true

  # The order book and trade tape live entirely in this process's memory.
  #
  # Two machines would serve two independent, divergent books, and letting a
  # machine stop would silently erase all state. So: exactly one machine, never
  # auto-stopped. This service cannot be scaled horizontally as written.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  # The engine sheds load with a 503 once its intake buffer fills, so a healthy
  # response here means the matching loop is still draining orders.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
