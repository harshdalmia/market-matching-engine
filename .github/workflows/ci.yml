name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: Engine (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs a working 64-bit cgo toolchain, which Linux
      # runners have and a stock Windows dev box often does not. This is the
      # authoritative race check for the project.
      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  web:
    name: Terminal (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
